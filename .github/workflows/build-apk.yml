name: 안드로이드 앱(APK) 만들기

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install

      - name: 웹 파일 준비
        run: npm run prepare-web

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 이름 바꾸기
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 계약조회.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 계약조회-APK
          path: 계약조회.apk
